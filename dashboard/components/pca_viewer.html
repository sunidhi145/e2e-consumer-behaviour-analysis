<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}html,body{height:100%}body{margin:0;display:flex;flex-direction:column;background:#0c1220;color:#e5e7eb;font:12px 'Segoe UI',sans-serif}
.toolbar{display:flex;align-items:center;gap:8px;padding:12px;flex-wrap:wrap}
button{background:#1c2538;border:1px solid #39435b;color:#e5e7eb;border-radius:6px;padding:7px 12px;cursor:pointer}
button:hover,button:focus-visible{background:#374264;outline:2px solid #a855f7}
.hint{color:#94a3b8;margin-left:auto}#scene{position:relative;flex:1;min-height:160px}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab;outline-offset:-3px}canvas:active{cursor:grabbing}
#tooltip{display:none;position:absolute;pointer-events:none;background:#171e30;border:1px solid #596580;border-radius:8px;padding:10px;white-space:pre-line;max-width:290px;z-index:1}
#legend{display:flex;gap:10px 20px;flex-wrap:wrap;padding:12px;color:#cbd5e1}.dot{width:9px;height:9px;display:inline-block;border-radius:50%;margin-right:6px}
@media(max-width:600px){.hint{display:none}.toolbar{padding:8px}#legend{gap:6px 12px;padding:8px;font-size:11px}}
</style>
</head>
<body>
<div class="toolbar"><button id="reset">Reset view</button><button id="zoom-in" aria-label="Zoom in">+</button><button id="zoom-out" aria-label="Zoom out">−</button><span id="count"></span><span class="hint">Drag to rotate · Scroll to zoom · Hover for details</span></div>
<div id="scene"><canvas id="plot" tabindex="0" role="img" aria-label="3D PCA cluster chart. Use arrow keys to rotate, plus and minus to zoom, and Home to reset."></canvas><div id="tooltip" role="status"></div></div>
<div id="legend"></div>
<script id="pca-data" type="application/json">__PCA_DATA__</script>
<script>
"use strict";
const data=JSON.parse(document.getElementById('pca-data').textContent);
const canvas=document.getElementById('plot'),ctx=canvas.getContext('2d');
const tooltip=document.getElementById('tooltip'),scene=document.getElementById('scene');
const all=data.points.concat(data.centroids);
const bounds=[0,1,2].map(i=>[Math.min(...data.points.map(p=>p.xyz[i])),Math.max(...data.points.map(p=>p.xyz[i]))]);
const center=bounds.map(b=>(b[0]+b[1])/2);
// Use one scale for all PCs to preserve relative distances and cluster shapes.
const span=Math.max(...bounds.map(b=>b[1]-b[0]),1e-9);
all.forEach(p=>p.normal=p.xyz.map((v,i)=>(v-center[i])/span*2));
let yaw=-0.65,pitch=0.4,zoom=1,width=1,height=1,projected=[],drag=null;
function active(p){return data.filter==='All'||p.cluster===data.filter;}
document.getElementById('count').textContent=data.points.filter(active).length.toLocaleString()+' customers';
const groups=new Map();
data.points.forEach(p=>groups.set(p.cluster,{segment:p.segment,color:p.color}));
for(const [cluster,group] of groups){
  const item=document.createElement('span'),dot=document.createElement('i');
  dot.className='dot';dot.style.background=group.color;item.append(dot);
  item.append(document.createTextNode('C'+cluster+' · '+group.segment.replaceAll('_',' ')));
  item.style.opacity=data.filter==='All'||data.filter===cluster?'1':'0.3';
  document.getElementById('legend').append(item);
}
const centroidLegend=document.createElement('span');centroidLegend.textContent='× Cluster centroids';document.getElementById('legend').append(centroidLegend);
function project(v){
  const x=v[0]*Math.cos(yaw)-v[1]*Math.sin(yaw),depth=v[0]*Math.sin(yaw)+v[1]*Math.cos(yaw);
  const y=v[2]*Math.cos(pitch)-depth*Math.sin(pitch),z=v[2]*Math.sin(pitch)+depth*Math.cos(pitch);
  const scale=Math.min(width*0.30,height*0.34)*zoom;
  return {x:width/2+x*scale,y:height/2-y*scale,z};
}
function line(a,b,color){const p=project(a),q=project(b);ctx.strokeStyle=color;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();}
function draw(){
  ctx.clearRect(0,0,width,height);ctx.lineWidth=1;ctx.font='12px Segoe UI';
  const low=bounds.map((b,i)=>(b[0]-center[i])/span*2),high=bounds.map((b,i)=>(b[1]-center[i])/span*2);
  for(let axis=0;axis<3;axis++){
    for(let tick=0;tick<=4;tick++){
      const t=tick/4,pos=low[axis]+(high[axis]-low[axis])*t;
      const a=low.slice();a[axis]=pos;
      for(let other=0;other<3;other++){if(other===axis)continue;const b=a.slice();b[other]=high[other];line(a,b,'#202d43');}
      const label=project(a);ctx.fillStyle='#8293ad';ctx.fillText((bounds[axis][0]+(bounds[axis][1]-bounds[axis][0])*t).toFixed(1),label.x+5,label.y+14);
    }
    const end=low.slice();end[axis]=high[axis];line(low,end,'#70809c');
    end[axis]+=0.12;const label=project(end);ctx.fillStyle='#e2e8f0';
    ctx.fillText('PC'+(axis+1)+' ('+((data.variance[axis]||0)*100).toFixed(1)+'%)',label.x-20,label.y-12);
  }
  projected=all.map(p=>({...project(p.normal),point:p})).sort((a,b)=>a.z-b.z);
  // Draw dimmed clusters first so the selected cluster stays visible.
  const ordered=projected.filter(p=>!active(p.point)).concat(projected.filter(p=>active(p.point)));
  for(const p of ordered){
    const selected=active(p.point);ctx.globalAlpha=selected?(p.point.centroid?1:0.78):0.07;
    ctx.fillStyle=p.point.color;
    if(p.point.centroid){
      ctx.strokeStyle='#f8fafc';ctx.lineWidth=2.5;ctx.beginPath();
      ctx.moveTo(p.x-6,p.y-6);ctx.lineTo(p.x+6,p.y+6);ctx.moveTo(p.x+6,p.y-6);ctx.lineTo(p.x-6,p.y+6);ctx.stroke();
      ctx.fillStyle='#f8fafc';ctx.fillText('C'+p.point.cluster,p.x+9,p.y-8);
    }else{ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();}
  }
  ctx.globalAlpha=1;
}
function resize(){
  width=scene.clientWidth;height=scene.clientHeight;const ratio=window.devicePixelRatio||1;
  canvas.width=width*ratio;canvas.height=height*ratio;ctx.setTransform(ratio,0,0,ratio,0,0);draw();
}
function reset(){yaw=-0.65;pitch=0.4;zoom=1;tooltip.style.display='none';draw();}
function changeZoom(factor){zoom=Math.max(0.3,Math.min(6,zoom*factor));tooltip.style.display='none';draw();}
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);tooltip.style.display='none';});
canvas.addEventListener('pointerup',()=>{drag=null;});
canvas.addEventListener('pointercancel',()=>{drag=null;});
canvas.addEventListener('pointerleave',()=>{tooltip.style.display='none';});
canvas.addEventListener('pointermove',e=>{
  if(drag){yaw+=(e.clientX-drag.x)*0.008;pitch=Math.max(-1.5,Math.min(1.5,pitch+(e.clientY-drag.y)*0.008));drag={x:e.clientX,y:e.clientY};draw();return;}
  const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;
  let nearest=null,distance=100;
  for(const p of projected){if(!active(p.point))continue;const d=(p.x-x)**2+(p.y-y)**2;if(d<distance){nearest=p.point;distance=d;}}
  if(!nearest){tooltip.style.display='none';return;}
  tooltip.textContent=(nearest.centroid?'Cluster centroid':'Customer '+nearest.id)+'\nCluster '+nearest.cluster+' · '+nearest.segment.replaceAll('_',' ')+'\n'+nearest.xyz.map((v,i)=>'PC'+(i+1)+': '+v.toFixed(3)).join(' · ');
  tooltip.style.display='block';tooltip.style.left=Math.max(0,Math.min(x+14,width-tooltip.offsetWidth))+'px';tooltip.style.top=Math.max(0,Math.min(y+14,height-tooltip.offsetHeight))+'px';
});
canvas.addEventListener('wheel',e=>{e.preventDefault();changeZoom(Math.exp(-e.deltaY*0.001));},{passive:false});
canvas.addEventListener('dblclick',reset);
canvas.addEventListener('keydown',e=>{
  if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','+','=','-','Home'].includes(e.key))return;
  e.preventDefault();
  if(e.key==='Home'){reset();return;}
  if(e.key==='+'||e.key==='='){changeZoom(1.2);return;}if(e.key==='-'){changeZoom(1/1.2);return;}
  if(e.key==='ArrowLeft')yaw-=0.12;if(e.key==='ArrowRight')yaw+=0.12;
  if(e.key==='ArrowUp')pitch=Math.min(1.5,pitch+0.12);if(e.key==='ArrowDown')pitch=Math.max(-1.5,pitch-0.12);draw();
});
document.getElementById('reset').addEventListener('click',reset);
document.getElementById('zoom-in').addEventListener('click',()=>changeZoom(1.2));
document.getElementById('zoom-out').addEventListener('click',()=>changeZoom(1/1.2));
new ResizeObserver(resize).observe(scene);
</script>
</body>
</html>
